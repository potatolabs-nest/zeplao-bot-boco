<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng nhiệt</title>
<link rel="stylesheet" href="board.css">

<body class="board">
<main id="wrap">
  <div id="map"></div>

  <!-- Trang chi tiết một mã: mở khi bấm vào một ô, che hẳn bản đồ chứ không bật lên đè lên nó.
       Một thẻ nổi giữa bảng thì vừa nhỏ vừa che mất chỗ người ta đang nhìn; cả trang thì đủ chỗ cho
       tên công ty, số của phiên và hồ sơ mà không phải cắt ngắn thứ gì. -->
  <section id="sheet" hidden>
    <header id="s-head">
      <div id="s-line"><b id="s-code"></b><span id="s-price"></span><span id="s-move"></span></div>
      <div id="s-name"></div>
      <div id="s-where" class="muted"></div>
    </header>
    <!-- Hai tab. Mặc định là Tổng quan; PTKT chỉ được tính khi có người bấm vào, vì một bài phân
         tích là bốn lượt gọi nguồn nến. -->
    <nav id="s-tabs">
      <button type="button" class="tab on" data-tab="all">Tổng quan</button>
      <button type="button" class="tab" data-tab="ptkt">Phân tích kỹ thuật</button>
    </nav>

    <div id="s-all">
    <div id="s-stats"></div>
    <div id="s-cols">
      <dl id="s-today"></dl>
      <dl id="s-firm"></dl>
    </div>
    <p id="s-about" class="muted"></p>

    <!-- Mười phiên gần nhất nằm cuối trang, dưới cả phần mô tả: nó là thứ để tra khi cần, không
         phải thứ liếc một cái là xong. Con số tóm tắt của nó — khối lượng bình quân — đã đứng sẵn
         trên đầu trang cạnh khối lượng hôm nay, nên cuộn xuống đây là việc chủ động. -->
    <h3 id="s-days-title" class="muted" hidden>10 phiên gần nhất</h3>
    <table id="s-days"></table>
    </div>

    <div id="s-ptkt" hidden>
      <p id="s-tk-wait" class="muted">Đang phân tích…</p>
      <div id="s-tk">
        <div id="s-tk-head"><b id="s-tk-verdict"></b><span id="s-tk-conf" class="muted"></span></div>
        <div id="s-tk-chart"></div>
        <div id="s-tk-cols">
          <ul id="s-tk-steps"></ul>
          <div id="s-tk-plan"></div>
        </div>
        <p id="s-tk-note" class="muted">Tín hiệu tự động, không phải khuyến nghị đầu tư.</p>
      </div>
    </div>
  </section>

  <button id="back" type="button" hidden>← Tất cả</button>
</main>

<!-- Một hàng duy nhất dưới chân: chú giải, hướng dẫn, rồi giờ. Bảng nhiệt sống bằng diện tích, mà
     một dòng tiêu đề riêng trên đỉnh ăn mất cả chục phần trăm chiều cao để nói một điều người mở
     nó đã biết — thanh tiêu đề của chính cái card đã ghi tên bot rồi. -->
<footer id="legend">
  <span class="tag"><i class="swatch ceiling"></i><span id="n-ceiling">0</span> trần</span>
  <span class="tag"><i class="swatch up"></i><span id="n-up">0</span> tăng</span>
  <span class="tag"><i class="swatch flat"></i><span id="n-flat">0</span> đứng</span>
  <span class="tag"><i class="swatch down"></i><span id="n-down">0</span> giảm</span>
  <span class="tag"><i class="swatch floor"></i><span id="n-floor">0</span> sàn</span>
  <span id="help" class="muted"></span>
  <span id="clock" class="muted">Đang mở…</span>
  <!-- Số bản dựng của gói widget. Hai ký tự, nhưng chúng trả lời được câu hỏi tốn nhiều thời gian
       nhất: máy này đang chạy gói nào — vì một phiên ghim phiên bản gói lúc nó được tạo ra. -->
  <span id="build" class="muted"></span>
</footer>

<!-- zeplao.js do nền tảng ghi vào gói lúc tải lên; xem term.html. Trang này là trang của **phiên**
     (`index.html` ở gốc gói), nên nó nhận được `onState` mỗi lần bot đẩy — khác thẻ view, vốn chỉ
     nhận đúng một lần dữ liệu đi kèm tin nhắn. -->
<script src="zeplao.js"></script>
<script src="board.js"></script>
</body>
</html>
