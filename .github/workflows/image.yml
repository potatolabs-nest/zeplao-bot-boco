# Dựng image và đẩy lên ghcr, mỗi lần `main` đổi.
#
# Bộ test chạy **trước** khi dựng, và đó là cả lý do việc này ở CI chứ không ở `Dockerfile`: một
# image dựng xong từ mã đỏ là một image trông y hệt image tốt, và nó sẽ nằm đó với thẻ `latest`
# cho tới khi có người chạy nó.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Không `npm ci`: repo không phụ thuộc gói nào, nên không có gì để cài.
      - run: npm test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Thẻ theo commit để quay lại được đúng bản đang chạy, và `latest` để chạy cho nhanh.
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
