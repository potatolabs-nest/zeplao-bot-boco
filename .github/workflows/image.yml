# Dựng image và đẩy lên ghcr, mỗi lần `main` đổi.
#
# Bộ test chạy **trước** khi dựng, và đó là cả lý do việc này ở CI chứ không ở `Dockerfile`: một
# image dựng xong từ mã đỏ là một image trông y hệt image tốt, và nó sẽ nằm đó với thẻ `latest`
# cho tới khi có người chạy nó.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: git.potatolabs.uk
  IMAGE_NAME: zeplao/zeplao-bot-boco

jobs:
  image:
    runs-on: linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Không `npm ci`: repo không phụ thuộc gói nào, nên không có gì để cài.
      - run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ forgejo.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Thẻ theo commit để quay lại được đúng bản đang chạy, và `latest` để chạy cho nhanh.
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
